<?xml version="1.0" encoding="UTF-8"?>
<svg width="772" height="250" viewBox="0 0 1544 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern gradient background -->
    <linearGradient id="modernGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a5298;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7e22ce;stop-opacity:1" />
    </linearGradient>
    
    <!-- Mesh gradient overlay -->
    <radialGradient id="meshGradient1" cx="20%" cy="30%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="meshGradient2" cx="80%" cy="70%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0" />
    </radialGradient>
    
    <!-- Glass effect -->
    <filter id="glass" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="over"/>
    </filter>
    
    <!-- Soft shadow -->
    <filter id="softShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-opacity="0.15"/>
    </filter>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1544" height="500" fill="url(#modernGradient)"/>
  
  <!-- Mesh gradient overlays -->
  <ellipse cx="300" cy="150" rx="400" ry="300" fill="url(#meshGradient1)"/>
  <ellipse cx="1244" cy="350" rx="500" ry="400" fill="url(#meshGradient2)"/>
  
  <!-- Geometric patterns -->
  <g opacity="0.1">
    <rect x="100" y="50" width="80" height="80" rx="20" fill="white" transform="rotate(45 140 90)"/>
    <rect x="1300" y="100" width="60" height="60" rx="15" fill="white" transform="rotate(45 1330 130)"/>
    <circle cx="200" cy="400" r="40" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="1400" cy="420" r="30" fill="none" stroke="white" stroke-width="2"/>
  </g>
  
  <!-- Content container -->
  <g transform="translate(100, 120)">
    <!-- Main title -->
    <text x="0" y="0" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="90" font-weight="800" fill="white">
      <tspan>Email Tracker</tspan>
    </text>
    
    <!-- Tagline with gradient -->
    <text x="0" y="80" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="36" font-weight="400" fill="white" opacity="0.9">
      <tspan>Track Opens &amp; Clicks for Every WordPress Email</tspan>
    </text>
    
    <!-- Feature badges -->
    <g transform="translate(0, 140)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="200" height="50" rx="25" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2"/>
        <text x="100" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">
          Real-time Tracking
        </text>
      </g>
      
      <!-- Badge 2 -->
      <g transform="translate(220, 0)">
        <rect x="0" y="0" width="220" height="50" rx="25" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2"/>
        <text x="110" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">
          WooCommerce Ready
        </text>
      </g>
      
      <!-- Badge 3 -->
      <g transform="translate(460, 0)">
        <rect x="0" y="0" width="180" height="50" rx="25" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2"/>
        <text x="90" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">
          Email Analytics
        </text>
      </g>
    </g>
  </g>
  
  <!-- Modern email visualization -->
  <g transform="translate(950, 100)">
    <!-- Floating envelope with glass effect -->
    <g transform="translate(0, 20)">
      <!-- Glass panel background -->
      <rect x="-20" y="-20" width="440" height="320" rx="30" fill="white" fill-opacity="0.08" filter="url(#glass)"/>
      
      <!-- Main envelope -->
      <g transform="translate(50, 50)">
        <rect x="0" y="30" width="300" height="200" rx="20" fill="white" filter="url(#softShadow)"/>
        
        <!-- Email content lines -->
        <rect x="30" y="70" width="240" height="4" rx="2" fill="#E2E8F0"/>
        <rect x="30" y="85" width="200" height="4" rx="2" fill="#E2E8F0"/>
        <rect x="30" y="100" width="220" height="4" rx="2" fill="#E2E8F0"/>
        <rect x="30" y="115" width="180" height="4" rx="2" fill="#E2E8F0"/>
        
        <!-- Envelope flap -->
        <path d="M0 40 L150 100 L300 40 L300 30 C300 20 290 10 280 10 L20 10 C10 10 0 20 0 30 Z" 
              fill="#F8FAFC"/>
      </g>
      
      <!-- Tracking indicator -->
      <g transform="translate(280, 180)">
        <!-- Hexagonal container -->
        <path d="M0 -50 L43.3 -25 L43.3 25 L0 50 L-43.3 25 L-43.3 -25 Z" 
              fill="#10B981" 
              filter="url(#glow)"/>
        
        <!-- Eye icon -->
        <g transform="scale(1.5)">
          <ellipse cx="0" cy="0" rx="20" ry="12" fill="white"/>
          <circle cx="0" cy="0" r="8" fill="#1e3c72"/>
          <circle cx="-3" cy="-3" r="3" fill="white"/>
        </g>
        
        <!-- Pulse rings -->
        <circle cx="0" cy="0" r="60" fill="none" stroke="white" stroke-width="2" opacity="0.2"/>
        <circle cx="0" cy="0" r="75" fill="none" stroke="white" stroke-width="1" opacity="0.1"/>
      </g>
      
      <!-- Analytics visualization -->
      <g transform="translate(60, 260)">
        <!-- Bar chart -->
        <rect x="0" y="20" width="15" height="30" rx="7" fill="#3B82F6" opacity="0.8"/>
        <rect x="25" y="10" width="15" height="40" rx="7" fill="#8B5CF6" opacity="0.8"/>
        <rect x="50" y="5" width="15" height="45" rx="7" fill="#10B981" opacity="0.8"/>
        <rect x="75" y="15" width="15" height="35" rx="7" fill="#F59E0B" opacity="0.8"/>
        
        <text x="45" y="75" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle" opacity="0.7">
          Analytics
        </text>
      </g>
    </g>
  </g>
  
  <!-- Decorative elements -->
  <g opacity="0.5">
    <!-- Floating dots -->
    <circle cx="850" cy="100" r="4" fill="white"/>
    <circle cx="870" cy="120" r="3" fill="white" opacity="0.8"/>
    <circle cx="860" cy="140" r="3.5" fill="white" opacity="0.6"/>
    
    <circle cx="100" cy="380" r="3" fill="white"/>
    <circle cx="115" cy="390" r="4" fill="white" opacity="0.8"/>
    <circle cx="105" cy="405" r="3" fill="white" opacity="0.6"/>
  </g>
  
  <!-- WordPress badge -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="180" height="40" rx="20" fill="white" fill-opacity="0.1"/>
    <text x="90" y="26" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="white" text-anchor="middle" opacity="0.8">
      WordPress Plugin
    </text>
  </g>
</svg>
